<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Talknik Login</title><style>body{font-family:Arial;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}.card{background:#1e293b;padding:30px;border-radius:15px;width:320px;text-align:center;color:white;border:1px solid #334155;}input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box;}button{width:100%;padding:12px;background:#38bdf8;color:#0f172a;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}h2{color:#38bdf8;}</style></head><body><div class="card"><h2>Talknik Login</h2><input type="text" id="user" placeholder="Username"><input type="password" id="pass" placeholder="Password"><button onclick="login()">Login</button><p id="msg" style="margin-top:15px;"></p></div><script>function login(){const u=document.getElementById("user").value;const p=document.getElementById("pass").value;const m=document.getElementById("msg");fetch(`/login-check?user=${u}&pass=${p}`).then(r=>r.text()).then(t=>{m.innerText=t;m.style.color=t.includes("??????")?"#4ade80":"#f87171";});}</script></body></html>
